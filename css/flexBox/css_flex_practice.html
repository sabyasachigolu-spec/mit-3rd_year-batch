<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmazonPage</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        height: 100vh;
        width: 100vw;
        display: flex;
        justify-content: center;
    }

    .main {
        border: 3px solid black;
        height: 95%;
        width: 35%;
        display: flex;
        flex-direction: column;
        position: relative;
    }

    .part1 {
        height: 65%;
        margin: 3px;
        padding: 5px;
        border: 2px solid black;
        font-size: 250px;
        display: flex;
        justify-content: center;
        align-items: center;

    }

    .part1 * {
        border: 1px solid red;
    }

    .part2 {
        height: 35%;
        margin: 3px;
        padding: 5px;
        border: 2px solid black;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    .button {
        background-color: rgb(230, 198, 38);
        color: rgb(0, 0, 0);
        border: none;
        border-radius: 10px;
        padding: 10px;
    }

    .font {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .tag {
        border: 1px solid red;
        width: 20%;
        background-color: red;
        color: white;
        text-align: center;
        padding: 5px 0;
        position: absolute;
        top: 10px;
        right: 10px;
    }
    
</style>

<body>
    <div class="main">
        <div class="part1">
            🎧
            <!-- <img src="712wyKsNmML (2).webp" alt="Headphone" height="100%" width="100%"> -->
        </div>
        <!-- <span class="tag">BestSeller </span> -->
        <span class="tag">BestSeller</span>
        <div class="part2">
            <h1>Wireless Headphone</h1>
            <div class="font">
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-regular fa-star"></i>
                <p>(4.2) | 1.2k reviews</p>
            </div>
            <p>Premium wireless headphone with clear sound,long battery life and comfortable design</p>
            <button class="button"><i class="fa-solid fa-cart-shopping"></i> Add to Cart</button>
        </div>
    </div>
</body>

</html>
