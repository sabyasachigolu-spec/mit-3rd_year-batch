<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }

        body{
            font-family: Arial, sans-serif;
        }
        nav{
            border: 2px solid lightgrey;
            display: flex;
            justify-content:space-between;
            padding: 15px 50px;
            align-items: center;
        }

        nav h1{
            color:green;
            font-size: 26px;
        }

        nav input{
            width: 35%;
            border-radius: 10px;
            border: 1px solid lightgrey;
            padding: 12px ;
        }

        nav ul{
            display: flex;
            justify-content: space-between;
            gap: 50px;
            align-items: center;
        }

        li{
            list-style: none;
            font-size: 17px;
        }
    </style>
</head>
<body>
    <nav>
        <h1>FreshMart</h1>
        <input type="text" placeholder="Search fruits and vegitables..."/>
        <ul>
            <li>Home</li>
            <li>Product</li>
            <li>Cart</li>
        </ul>
    </nav>
    
</body>
</html>
