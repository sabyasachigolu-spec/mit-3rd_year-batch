<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            border: 1px solid blue;
        }
        .grid-container{
            height: 60vh;
            width: 60vw;
            border: 2px solid red;
            display: grid;
            grid-template-columns: 1fr 200px 1fr 200px;
            grid-template-rows: 1fr 1fr 1fr;
        }
    </style>
</head>
<body>
    <div class="grid-container">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>

    </div>
</body>
</html>
